name = "modocus-ai-proxy"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[ai]
binding = "AI"

# production (default deploy)
[vars]
ENVIRONMENT = "production"
ALLOWED_BUNDLE_IDS = "app.modocus,app.modocus.preview,app.modocus.development"
ALLOWED_PRODUCT_IDS = "app.modocus.ai.monthly"
ALLOW_SANDBOX = "true"
# Cloudflare's account-level default AI Gateway. The binding creates it on first use.
# Third-party models (openai/…, anthropic/…) bill via Unified Billing credits.
AI_GATEWAY_ID = "default"
# Never set GATEWAY_COLLECT_LOG=true in production — stores full user prompts in CF logs.

[[kv_namespaces]]
binding = "USAGE"
id = "57dbbb779a7e412eb5398b2a5cbd6174"

[[durable_objects.bindings]]
name = "USAGE_LEDGER"
class_name = "UsageLedger"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UsageLedger"]

[[routes]]
pattern = "ai.modocus.app/*"
zone_name = "modocus.app"

# Secrets:
#   DASHBOARD_TOKEN     — operator dashboard (≥16 chars) on prod + staging
#   DEV_BYPASS_TOKEN    — staging only
#   SUBJECT_HASH_SALT   — random secret (≥16 chars), distinct per environment
#   OPENAI_API_KEY / OPENROUTER_API_KEY — only if ALLOW_LEGACY_HTTP_UPSTREAM=true
# Vars:
#   AI_GATEWAY_ID — gateway name for third-party models (Unified Billing)
# App Store Server Notifications V2:
#   production https://ai.modocus.app/apple/notifications
#   sandbox    https://ai-staging.modocus.app/apple/notifications

# ── staging ────────────────────────────────────────────────────────────────
[env.staging]
name = "modocus-ai-proxy-staging"
workers_dev = true
preview_urls = false
routes = []

[env.staging.ai]
binding = "AI"

[env.staging.vars]
ENVIRONMENT = "staging"
ALLOWED_BUNDLE_IDS = "app.modocus,app.modocus.preview,app.modocus.development"
ALLOWED_PRODUCT_IDS = "app.modocus.ai.monthly"
ALLOW_SANDBOX = "true"
AI_GATEWAY_ID = "default"

[[env.staging.kv_namespaces]]
binding = "USAGE"
id = "57dbbb779a7e412eb5398b2a5cbd6174"

[[env.staging.durable_objects.bindings]]
name = "USAGE_LEDGER"
class_name = "UsageLedger"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["UsageLedger"]

# Secrets (staging only): DEV_BYPASS_TOKEN
